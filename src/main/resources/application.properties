spring.application.name=spring-bedrock-demo
server.port=${PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
spring.jackson.deserialization.fail-on-unknown-properties=true

spring.ai.bedrock.aws.region=${AWS_REGION:us-east-1}
spring.ai.bedrock.aws.timeout=30s
spring.ai.bedrock.converse.chat.options.model=${BEDROCK_MODEL_ID:us.anthropic.claude-sonnet-5-5}
# Sonnet 5.5 rejects temperature; clear Spring AI's default.
spring.ai.bedrock.converse.chat.options.temperature=
spring.ai.bedrock.converse.chat.options.max-tokens=256
spring.ai.retry.max-attempts=1

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
